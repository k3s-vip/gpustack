apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: gpustack-operator
  namespace: kube-system
spec:
  chart: gpustack-operator
  createNamespace: true
  failurePolicy: retry
  insecureSkipTLSVerify: true
  repo: https://gpustack.github.io/gpustack-operator/charts
  targetNamespace: gpustack-system
  valuesContent: |
    cleanupOnUninstall: true
    csi-driver-nfs:
      controller:
        nodeSelector:
          operator: ""
      enabled: false
      image:
        csiProvisioner:
          repository: /muicoder/csi-provisioner
          tag: v6.3.0
        csiResizer:
          repository: /muicoder/csi-resizer
          tag: v2.2.1
        csiSnapshotter:
          repository: /muicoder/csi-snapshotter
          tag: v8.6.0
        livenessProbe:
          repository: /muicoder/livenessprobe
          tag: v2.19.0
        nfs:
          repository: /muicoder/nfsplugin
          tag: v4.13.4
        nodeDriverRegistrar:
          repository: /muicoder/csi-node-driver-registrar
          tag: v2.17.0
      node:
        nodeSelector:
          kubernetes.io/os: linux
    csi-driver-s3:
      controller:
        nodeSelector:
          operator: ""
      enabled: false
      images:
        csiProvisioner: docker.io/muicoder/csi-provisioner:v6.3.0
        livenessProbe: docker.io/muicoder/livenessprobe:v2.19.0
        nodeDriverRegistrar: docker.io/muicoder/csi-node-driver-registrar:v2.17.0
        s3: docker.io/thxcode/csi-s3-driver:v0.43.7
      node:
        nodeSelector:
          kubernetes.io/os: linux
    deviceManager:
      enabled: true
    global:
      certmanager:
        enabled: false
      nodeSelector:
        operator: ""
    kueue:
      controllerManager:
        manager:
          image:
            repository: docker.io/muicoder/kueue
            tag: v0.18.6
        nodeSelector:
          operator: ""
      enabled: true
    networkPolicy:
      enabled: false
    node-feature-discovery:
      enabled: true
      gc:
        nodeSelector:
          operator: ""
      image:
        repository: docker.io/muicoder/node-feature-discovery
        tag: v0.19.0
      master:
        nodeSelector:
          operator: ""
      topologyUpdater:
        createCRDs: true
        enable: false
        nodeSelector:
          operator: ""
      worker:
        nodeSelector:
          kubernetes.io/os: linux
    worker:
      dataDir: /var/lib/gpustack
      enabled: true
      nodeSelector:
        operator: ""
  version: 0.8.4
