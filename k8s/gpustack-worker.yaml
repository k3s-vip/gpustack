---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: gpustack
  namespace: kube-system
spec: # dependencies: gpustack-operator and higress-core
  chartContent: 
  createNamespace: true
  failurePolicy: abort
  targetNamespace: gpustack-system
  valuesContent: |
    gateway: # higress-core
      ingressClassname: higress
      namespace: higress-system
    global:
      hub: swr.cn-south-1.myhuaweicloud.com
      nodeSelector:
        kubernetes.io/os: linux
    gpustack-operator: # gpustack-operator
      cleanupOnUninstall: false
    higress-core:
      enabled: false
    image:
      tag: v2.3.1
    imagePullSecret:
      create: false
    registrationToken: gpustack_x16_y32
    server:
      enabled: false
    worker:
      cpuEnabled: true
      enabled: true
      gpuVendors:
        - nvidia
      serverURL: http://192.168.64.169:8000
