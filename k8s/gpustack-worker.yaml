                  fieldPath: spec.nodeName
          envFrom:
            - secretRef:
                name: registration-token
                optional: false
          image: swr.cn-south-1.myhuaweicloud.com/gpustack/gpustack:v2.2.3
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 2
          name: gpustack-worker
          ports:
            - containerPort: 10150
              name: api
              protocol: TCP
            - containerPort: 10151
              name: metrics
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 2
          resources: {}
          securityContext:
            allowPrivilegeEscalation: true
            capabilities: {}
            privileged: true
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/lib/gpustack
              name: gpustack-data-dir
              readOnly: false
      dnsPolicy: ClusterFirstWithHostNet
      # Disable Kubernetes service-link env injection. The gpustack-worker
      # Service would otherwise inject GPUSTACK_WORKER_PORT=tcp://... which
      # collides with the GPUSTACK_-prefixed config defaults and crashes prerun.
      # GPUStack sets every env it needs explicitly and resolves peers via DNS,
      # so it never relies on these link vars. (KUBERNETES_SERVICE_HOST/_PORT are
      # exempt from this flag and keep working.)
      enableServiceLinks: false
      hostIPC: true
      hostNetwork: true
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: 'true'
      runtimeClassName: nvidia
      serviceAccountName: gpustack-worker
      volumes:
        - hostPath:
            path: /data/gpustack
            type: DirectoryOrCreate
          name: gpustack-data-dir
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
